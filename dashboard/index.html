<style>
    /* ============================================
       DESIGN SYSTEM
    ============================================ */
    :root {
        --blue-50:  #EFF6FF;
        --blue-100: #DBEAFE;
        --blue-200: #BFDBFE;
        --blue-300: #93C5FD;
        --blue-400: #60A5FA;
        --blue-500: #3B82F6;
        --blue-600: #2563EB;
        --blue-700: #1D4ED8;
        --blue-800: #1E40AF;
        --blue-900: #1E3A8A;

        --ink-900: #0F172A;
        --ink-700: #334155;
        --ink-500: #64748B;
        --ink-400: #94A3B8;

        --surface: #FFFFFF;
        --surface-soft: #F8FAFC;
        --surface-mute: #F1F5F9;

        --border-soft: rgba(148, 163, 184, 0.16);
        --border-blue: rgba(59, 130, 246, 0.2);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        background: #F5F8FC;
        color: var(--ink-900);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding-bottom: 110px;
        overflow-x: hidden;
    }

    .dark body {
        background: #0A0F1E;
        color: #F1F5F9;
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* ============================================
       HEADER
    ============================================ */
    .app-header {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--border-soft);
    }
    .dark .app-header {
        background: rgba(10, 15, 30, 0.85);
        border-bottom-color: rgba(148, 163, 184, 0.08);
    }
    .app-header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 16px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    @media (min-width: 768px) {
        .app-header-inner { padding: 0 24px; height: 68px; }
    }

    .logo-badge {
        width: 40px; height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        font-size: 18px;
        box-shadow: 0 6px 16px -4px rgba(30, 64, 175, 0.5);
        flex-shrink: 0;
    }
    .logo-title {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
    }
    .dark .logo-title {
        background: linear-gradient(135deg, #93C5FD 0%, #60A5FA 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .logo-sub {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #94A3B8;
        margin-top: 3px;
        line-height: 1;
    }

    .icon-btn {
        width: 40px; height: 40px;
        border-radius: 12px;
        background: #F1F5F9;
        display: flex; align-items: center; justify-content: center;
        color: #475569;
        font-size: 15px;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
        flex-shrink: 0;
        position: relative;
    }
    .icon-btn:hover { background: #DBEAFE; color: #1E40AF; }
    .dark .icon-btn { background: rgba(30, 41, 59, 0.7); color: #CBD5E1; }
    .dark .icon-btn:hover { background: rgba(37, 99, 235, 0.2); color: #93C5FD; }

    /* ============================================
       LAYOUT
    ============================================ */
    .app-main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 76px 14px 0;
    }
    @media (min-width: 768px) {
        .app-main { padding: 92px 24px 0; }
    }

    /* ============================================
       SEARCH BAR
    ============================================ */
    .search-section {
        position: sticky;
        top: 68px;
        z-index: 40;
        padding: 8px 0;
    }
    @media (min-width: 768px) {
        .search-section { top: 76px; }
    }

    .search-card {
        background: #FFFFFF;
        border: 1px solid var(--border-soft);
        border-radius: 16px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    @media (min-width: 640px) {
        .search-card { flex-direction: row; align-items: center; }
    }
    .dark .search-card {
        background: rgba(15, 23, 42, 0.85);
        border-color: rgba(148, 163, 184, 0.08);
        box-shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.4);
    }
    .search-card:focus-within {
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 8px 24px -6px rgba(30, 64, 175, 0.18);
    }

    .search-input-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px;
        min-width: 0;
    }
    .search-icon-pill {
        width: 34px; height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
        color: #1D4ED8;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
    }
    .dark .search-icon-pill {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(59, 130, 246, 0.1));
        color: #93C5FD;
    }
    #searchInput {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        color: var(--ink-900);
        padding: 8px 0;
        min-width: 0;
    }
    #searchInput::placeholder { color: #94A3B8; font-weight: 500; }
    .dark #searchInput { color: #F1F5F9; }
    .dark #searchInput::placeholder { color: #64748B; }

    .filter-select-wrap {
        position: relative;
        background: #F8FAFC;
        border: 1px solid var(--border-soft);
        border-radius: 12px;
        transition: all 0.25s ease;
        min-width: 130px;
    }
    .dark .filter-select-wrap { background: rgba(30, 41, 59, 0.5); border-color: rgba(148,163,184,0.08); }
    .filter-select-wrap:hover { border-color: rgba(59, 130, 246, 0.3); }
    #categoryFilter {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #334155;
        padding: 11px 14px 11px 34px;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
    }
    .dark #categoryFilter { color: #CBD5E1; }
    .filter-select-wrap::after {
        content: '\f107';
        font-family: 'Font Awesome 6 Free';
        font-weight: 900;
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #94A3B8;
        font-size: 11px;
        pointer-events: none;
    }

    /* ============================================
       SECTION HEADER
    ============================================ */
    .section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 4px 12px;
    }
    .section-icon {
        width: 32px; height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
        color: #1D4ED8;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
    }
    .dark .section-icon {
        background: linear-gradient(135deg, rgba(37,99,235,0.22), rgba(59,130,246,0.1));
        color: #93C5FD;
    }
    .section-title {
        font-size: 17px;
        font-weight: 900;
        color: var(--ink-900);
        letter-spacing: -0.02em;
    }
    .dark .section-title { color: #F1F5F9; }

    /* ============================================
       CATEGORIES MARQUEE
    ============================================ */
    .cats-viewport {
        position: relative;
        overflow: hidden;
        padding: 6px 4px 18px;
        margin: 0 -14px;
        -webkit-mask-image: linear-gradient(to left, transparent 0, black 40px, black calc(100% - 40px), transparent 100%);
        mask-image: linear-gradient(to left, transparent 0, black 40px, black calc(100% - 40px), transparent 100%);
    }
    @media (min-width: 768px) {
        .cats-viewport {
            margin: 0 -24px;
            -webkit-mask-image: linear-gradient(to left, transparent 0, black 60px, black calc(100% - 60px), transparent 100%);
            mask-image: linear-gradient(to left, transparent 0, black 60px, black calc(100% - 60px), transparent 100%);
        }
    }

    .cats-track {
        display: flex;
        gap: 10px;
        width: max-content;
        will-change: transform;
        transform: translate3d(0,0,0);
    }

    .cat-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 96px;
        height: 96px;
        padding: 10px 8px;
        border-radius: 16px;
        background: #FFFFFF;
        border: 1px solid var(--border-soft);
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.3s ease,
                    border-color 0.3s ease;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        user-select: none;
        -webkit-user-select: none;
    }
    .dark .cat-chip {
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
        border-color: rgba(148, 163, 184, 0.08);
    }
    .cat-chip:active { transform: scale(0.96); }
    .cat-chip:hover {
        transform: translateY(-4px);
        border-color: rgba(59, 130, 246, 0.35);
        box-shadow: 0 12px 24px -8px rgba(30, 64, 175, 0.25);
    }
    .cat-chip-icon {
        width: 38px; height: 38px;
        border-radius: 11px;
        background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
        color: #1D4ED8;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dark .cat-chip-icon {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.22), rgba(59, 130, 246, 0.1));
        color: #93C5FD;
    }
    .cat-chip:hover .cat-chip-icon { transform: scale(1.1) rotate(-5deg); }
    .cat-chip-label {
        font-size: 11.5px;
        font-weight: 800;
        color: #334155;
        text-align: center;
        line-height: 1.1;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .dark .cat-chip-label { color: #CBD5E1; }

    /* "All" chip special */
    .cat-chip-all {
        background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
        border-color: transparent;
        box-shadow: 0 8px 20px -6px rgba(30, 64, 175, 0.5);
    }
    .cat-chip-all .cat-chip-icon {
        background: rgba(255,255,255,0.18);
        color: #FFFFFF;
    }
    .cat-chip-all .cat-chip-label { color: #FFFFFF; }
    .cat-chip-all:hover {
        box-shadow: 0 16px 28px -8px rgba(30, 64, 175, 0.6);
        border-color: transparent;
    }

    /* Skeleton chip */
    .cat-chip-skel {
        width: 96px; height: 96px;
        border-radius: 16px;
        background: linear-gradient(90deg, #EFF3F8 25%, #F8FAFC 50%, #EFF3F8 75%);
        background-size: 200% 100%;
        animation: skel 1.6s ease-in-out infinite;
        flex-shrink: 0;
    }
    .dark .cat-chip-skel {
        background: linear-gradient(90deg, #1E293B 25%, #273449 50%, #1E293B 75%);
        background-size: 200% 100%;
    }
    @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (min-width: 640px) {
        .cat-chip { width: 108px; height: 108px; border-radius: 18px; }
        .cat-chip-icon { width: 44px; height: 44px; border-radius: 13px; font-size: 18px; }
        .cat-chip-label { font-size: 12.5px; }
        .cats-track { gap: 14px; }
        .cat-chip-skel { width: 108px; height: 108px; }
    }

    /* ============================================
       COURSE CARDS
    ============================================ */
    .courses-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }
    @media (min-width: 640px) { .courses-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
    @media (min-width: 1024px) { .courses-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }

    .course-card {
        background: #FFFFFF;
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.4s ease,
                    border-color 0.4s ease;
        display: flex;
        flex-direction: column;
        content-visibility: auto;
        contain-intrinsic-size: 380px;
    }
    .dark .course-card {
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.55), rgba(15, 23, 42, 0.85));
        border-color: rgba(148, 163, 184, 0.07);
    }
    .course-card:hover {
        transform: translateY(-4px);
        border-color: rgba(59, 130, 246, 0.28);
        box-shadow: 0 20px 36px -14px rgba(30, 64, 175, 0.22), 0 6px 14px -6px rgba(15, 23, 42, 0.06);
    }

    .course-media {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0F172A;
        overflow: hidden;
    }
    .course-media iframe {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        border: 0;
    }
    .course-cat-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #FFFFFF;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.02em;
        border: 1px solid rgba(255, 255, 255, 0.15);
        max-width: calc(100% - 20px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .course-cat-badge i {
        font-size: 6px;
        color: #60A5FA;
    }

    .course-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    @media (min-width: 768px) { .course-body { padding: 16px; } }

    .course-title {
        font-size: 15px;
        font-weight: 800;
        color: var(--ink-900);
        line-height: 1.4;
        margin-bottom: 6px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        letter-spacing: -0.01em;
    }
    .dark .course-title { color: #F1F5F9; }

    .course-desc {
        font-size: 12.5px;
        color: var(--ink-500);
        line-height: 1.6;
        margin-bottom: 14px;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .dark .course-desc { color: #94A3B8; }

    .course-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 14px;
        border-top: 1px solid var(--border-soft);
    }
    .dark .course-footer { border-top-color: rgba(148, 163, 184, 0.08); }

    .price-free {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 8px;
        background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
        color: #047857;
        font-size: 11.5px;
        font-weight: 800;
        border: 1px solid rgba(16, 185, 129, 0.18);
        white-space: nowrap;
    }
    .dark .price-free {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.08));
        color: #6EE7B7;
        border-color: rgba(16, 185, 129, 0.22);
    }
    .price-paid {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 8px;
        background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
        color: #1E40AF;
        font-size: 11.5px;
        font-weight: 800;
        border: 1px solid rgba(59, 130, 246, 0.2);
        white-space: nowrap;
    }
    .dark .price-paid {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(59, 130, 246, 0.08));
        color: #93C5FD;
        border-color: rgba(59, 130, 246, 0.25);
    }

    .btn-enroll {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, #1D4ED8 0%, #3B82F6 100%);
        color: #FFFFFF;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 800;
        border: none;
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 4px 12px -3px rgba(29, 78, 216, 0.45);
        white-space: nowrap;
        letter-spacing: -0.01em;
    }
    .btn-enroll:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px -4px rgba(29, 78, 216, 0.5);
    }
    .btn-enroll:active { transform: translateY(0); }

    .btn-continue {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
        color: #047857;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 800;
        border: 1px solid rgba(16, 185, 129, 0.22);
        cursor: pointer;
        transition: all 0.25s ease;
        white-space: nowrap;
    }
    .dark .btn-continue {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.08));
        color: #6EE7B7;
        border-color: rgba(16, 185, 129, 0.25);
    }
    .btn-continue:hover { transform: translateY(-1px); box-shadow: 0 6px 14px -4px rgba(16, 185, 129, 0.3); }

    /* ============================================
       BOTTOM NAV
    ============================================ */
    .bottom-nav {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 45;
        width: calc(100% - 28px);
        max-width: 400px;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border: 1px solid var(--border-soft);
        box-shadow: 0 12px 32px -8px rgba(15, 23, 42, 0.18), 0 4px 10px -4px rgba(15, 23, 42, 0.08);
    }
    .dark .bottom-nav {
        background: rgba(15, 23, 42, 0.9);
        border-color: rgba(148, 163, 184, 0.08);
        box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 6px;
        border-radius: 999px;
        background: transparent;
        border: none;
        cursor: pointer;
        color: #64748B;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: inherit;
        position: relative;
    }

    // ==========================================

            'برمجة': 'fa-code', 'تصميم': 'fa-paint-brush', 'تسويق': 'fa-bullhorn',
            'لغات': 'fa-language', 'طب وصحة': 'fa-heartbeat', 'أعمال': 'fa-briefcase',

    // ==========================================
    // REAL-TIME
    // ==========================================
    function coursesChanged(a, b) {
        if (!a || !b) return true;
        if (a.length !== b.length) return true;
        const sig = c => `${c.id}|${c.title||''}|${c.category||''}|${c.description||''}|${c.price||''}|${c.playlist_id||''}|${c.num||''}`;
        return a.map(sig).sort().join('###') !== b.map(sig).sort().join('###');
    }

    function setupRealtime() {
        if (unsubscribeRealtime) unsubscribeRealtime();
        unsubscribeRealtime = db.collection('courses').onSnapshot(snap => {
            const serverCourses = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            serverCourses.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            if (coursesChanged(allCourses, serverCourses)) {
                allCourses = serverCourses;
                saveCache(allCourses);
                renderCategories();
                renderCourses();
                if (realtimeInitialized) console.log(`🔄 Real-time: ${allCourses.length} courses`);
            }
            realtimeInitialized = true;
        }, err => console.warn("Realtime error:", err));
    }

    async function fetchFromServer() {
        try {
            const snap = await db.collection('courses').get({ source: 'server' });
            const sc = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            sc.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            allCourses = sc;
            saveCache(allCourses);
            renderCategories();
            renderCourses();
        } catch (e) {
            console.error("Server fetch error:", e);
            const c = loadCache();
            allCourses = c && c.length ? c : [];
            renderCategories();
            renderCourses();
        }
    }

    // ==========================================
    // RENDER CATEGORIES
    // ==========================================
    let categoriesReady = false;
    function renderCategories(useFallback = false) {
        const track = document.getElementById('catsTrack');
        const filterSelect = document.getElementById('categoryFilter');
        if (!track || !filterSelect) return;

        let categories = [];
        let useFallbackIcons = false;

        if (useFallback || allCourses.length === 0) {
            categories = FALLBACK_CATEGORIES.map(c => c.name);
            useFallbackIcons = true;
        } else {
            categories = [...new Set(allCourses.map(c => c.category || 'عام'))];
        }

        // Build chip set
        const allChip = `
            <div onclick="filterByCategory('all')" class="cat-chip cat-chip-all">
                <div class="cat-chip-icon"><i class="fas fa-th-large"></i></div>
                <span class="cat-chip-label">الكل</span>
            </div>
        `;

        let chips = allChip;
        categories.forEach(cat => {
            const safe = cat.replace(/'/g, "\\'");
            const icon = useFallbackIcons
                ? (FALLBACK_CATEGORIES.find(c => c.name === cat)?.icon || 'fa-book')
                : getCatIcon(cat);
            chips += `
                <div onclick="filterByCategory('${safe}')" class="cat-chip">
                    <div class="cat-chip-icon"><i class="fas ${icon}"></i></div>
                    <span class="cat-chip-label">${cat}</span>
                </div>
            `;
        });

        // Duplicate 2x for seamless loop
        track.innerHTML = chips + chips;

        // Reset marquee position
        marqueeState.position = 0;
        marqueeState.setWidth = 0;
        track.style.transform = 'translate3d(0,0,0)';

        // Re-measure after DOM update
        requestAnimationFrame(() => {
            marqueeState.setWidth = track.scrollWidth / 2;
            // Start position: shifted left by setWidth (showing second set)
            track.style.transform = `translate3d(${-marqueeState.setWidth}px, 0, 0)`;
            marqueeState.position = 0;
        });

        // Filter select
        filterSelect.innerHTML = '<option value="">كل التخصصات</option>';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            filterSelect.appendChild(opt);
        });

        categoriesReady = true;
        console.log(`✅ Rendered ${categories.length} categories`);
    }

    // ==========================================
    // CATEGORIES MARQUEE (JS-based, robust)
    // ==========================================
    const marqueeState = {
        position: 0,
        setWidth: 0,
        paused: false,
        resumeTimer: null,
        speed: 0.4, // px per frame @60fps ≈ 24px/s
        lastFrame: 0
    };

    function initCategoriesMarquee() {
        const viewport = document.getElementById('catsViewport');
        const track = document.getElementById('catsTrack');
        if (!viewport || !track) return;

        // Pause on interaction
        const pause = () => {
            marqueeState.paused = true;
            if (marqueeState.resumeTimer) {
                clearTimeout(marqueeState.resumeTimer);
                marqueeState.resumeTimer = null;
            }
        };
        const resume = (delay = 0) => {
            if (marqueeState.resumeTimer) clearTimeout(marqueeState.resumeTimer);
            marqueeState.resumeTimer = setTimeout(() => {
                marqueeState.paused = false;
            }, delay);
        };

        viewport.addEventListener('mouseenter', pause);
        viewport.addEventListener('mouseleave', () => resume(0));
        viewport.addEventListener('touchstart', pause, { passive: true });
        viewport.addEventListener('touchend', () => resume(2000), { passive: true });
        viewport.addEventListener('touchcancel', () => resume(2000), { passive: true });
        viewport.addEventListener('mousedown', pause);
        viewport.addEventListener('mouseup', () => resume(2000));

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pause();
            else resume(0);
        });

        // Re-measure on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                marqueeState.setWidth = track.scrollWidth / 2;
                marqueeState.position = 0;
                track.style.transform = `translate3d(${-marqueeState.setWidth}px, 0, 0)`;
            }, 200);
        });

        // Animation loop
        function tick(now) {
            if (marqueeState.setWidth > 0 && !marqueeState.paused) {
                marqueeState.position += marqueeState.speed;
                if (marqueeState.position >= marqueeState.setWidth) {
                    marqueeState.position -= marqueeState.setWidth;
                }
                // translateX: from -setWidth to 0 (moves content to the RIGHT)
                const x = marqueeState.position - marqueeState.setWidth;
                track.style.transform = `translate3d(${x}px, 0, 0)`;
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    // ==========================================
    // BUILD COURSE CARD
    // ==========================================
    function buildCourseCard(course, isEnrolled) {
        const isFree = (course.price === 'free' || course.price === 'مجانية' || !course.price);
        const priceHTML = isFree
            ? '<span class="price-free"><i class="fas fa-bolt"></i> مجانية</span>'
            : `<span class="price-paid"><i class="fas fa-tag"></i> ${course.price}</span>`;

        let media;
        if (course.playlist_id) {
            media = `<iframe src="https://www.youtube.com/embed/videoseries?list=${course.playlist_id}"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen loading="lazy"></iframe>`;
        } else {
            media = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E2E8F0,#CBD5E1);color:#64748B;font-size:24px;"><i class="fas fa-video-slash"></i></div>`;
        }

        return `
            <div class="course-card">
                <div class="course-media">
                    ${media}
                    <div class="course-cat-badge">
                        <i class="fas fa-circle"></i>
                        ${course.category || 'عام'}
                    </div>
                </div>
                <div class="course-body">
                    <h3 class="course-title">${course.title || 'بدون عنوان'}</h3>
                    <p class="course-desc">${course.description || 'لا يوجد وصف'}</p>
                    <div class="course-footer">
                        ${priceHTML}
                        <button onclick="${isEnrolled ? `openPlayer('${course.id}')` : `enrollCourse('${course.id}')`}"
                            class="${isEnrolled ? 'btn-continue' : 'btn-enroll'}">
                            ${isEnrolled ? 'استكمال <i class="fas fa-play" style="font-size:9px;"></i>' : 'سجّل الآن <i class="fas fa-arrow-left" style="font-size:10px;"></i>'}
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    // ==========================================
    // RENDER COURSES
    // ==========================================
    function renderCourses(filter = null) {
        if (filter !== null) currentFilter = filter;
        const grid = document.getElementById('coursesGrid');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const noResults = document.getElementById('noResults');
        const countEl = document.getElementById('coursesCount');

        let filtered = allCourses;

        if (!filtered || filtered.length === 0) {
            grid.innerHTML = '';
            noResults.classList.add('show');
            loadMoreBtn.style.display = 'none';
            if (countEl) countEl.textContent = '';
            return;
        }

        const f = currentFilter;
        if (f && f !== 'all' && f !== '') {
            filtered = filtered.filter(c =>
                (c.category || 'عام') === f ||
                (c.title && c.title.includes(f)) ||
                (c.description && c.description.includes(f))
            );
        }

        if (filtered.length === 0) {
            grid.innerHTML = '';
            noResults.classList.add('show');
            loadMoreBtn.style.display = 'none';
            if (countEl) countEl.textContent = '';
            return;
        }

        noResults.classList.remove('show');
        const firstPage = filtered.slice(0, pageSize);
        displayedCourses = filtered;

        grid.innerHTML = firstPage.map(c => buildCourseCard(c, appState.myCourses.includes(c.id))).join('');
        if (countEl) countEl.textContent = `${filtered.length} دورة`;

        if (filtered.length > pageSize) {
            loadMoreBtn.style.display = 'inline-flex';
            loadMoreBtn.onclick = loadMore;
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    function loadMore() {
        const grid = document.getElementById('coursesGrid');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const shown = grid.children.length;
        const total = displayedCourses.length;
        if (shown >= total) {
            loadMoreBtn.style.display = 'none';
            return;
        }
        const nextCount = Math.min(shown + pageSize, total);
        const nextCourses = displayedCourses.slice(shown, nextCount);
        const frag = document.createDocumentFragment();
        nextCourses.forEach(c => {
            const wrap = document.createElement('div');
            wrap.innerHTML = buildCourseCard(c, appState.myCourses.includes(c.id));
            frag.appendChild(wrap.firstElementChild);
        });
        grid.appendChild(frag);
        if (shown + nextCourses.length >= total) loadMoreBtn.style.display = 'none';
    }

    // ==========================================
    // ENROLLMENT
    // ==========================================
    function enrollCourse(id) {
        if (!appState.myCourses.includes(id)) {
            appState.myCourses.push(id);
            localStorage.setItem("myCourses", JSON.stringify(appState.myCourses));
            if (!appState.progress[id]) {
                appState.progress[id] = { completed: [] };
                localStorage.setItem("courseProgress", JSON.stringify(appState.progress));
            }
            showToast("تم التسجيل بنجاح 🎉", "success");
            renderCourses();
            renderMyCourses();
            updateNavState();
            if (auth.currentUser) {
                appState.pendingEnrollments.push({
                    userId: auth.currentUser.uid,
                    courseId: id
                });
            }
        }
    }

    async function flushEnrollments() {
        if (!appState.pendingEnrollments.length || !auth.currentUser) return;
        const batch = db.batch();
        const userRef = db.collection('users').doc(auth.currentUser.uid);
        appState.pendingEnrollments.forEach(e => {
            batch.set(userRef.collection('enrollments').doc(e.courseId), {
                enrolledAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        });
        try {
            await batch.commit();
            appState.pendingEnrollments = [];
        } catch (e) { console.warn("Enroll flush error:", e); }
    }

    // ==========================================
    // PLAYER
    // ==========================================
    function openPlayer(id) {
        const course = allCourses.find(c => c.id === id);
        if (!course) return;
        appState.currentCourseId = id;
        document.getElementById('playerCourseTitle').innerText = course.title || '';
        document.getElementById('playerCourseLabel').innerText = course.title || '';
        document.getElementById('playerCourseDesc').innerText = course.description || '';

        const frame = document.getElementById('playerFrame');
        frame.src = course.playlist_id ? `https://www.youtube.com/embed/videoseries?list=${course.playlist_id}` : '';

        renderPlaylist(id, course.num || 10);
        document.getElementById('playerOverlay').classList.add('show');
        document.body.style.overflow = 'hidden';
        localStorage.setItem("lastViewedCourse", JSON.stringify({ id: course.id, title: course.title }));
    }

    function closePlayer() {
        document.getElementById('playerOverlay').classList.remove('show');
        document.getElementById('playerFrame').src = '';
        document.body.style.overflow = '';
        renderMyCourses();
        flushProgress();
    }

    function renderPlaylist(courseId, total) {
        const container = document.getElementById('playlistContainer');
        const prog = appState.progress[courseId] || { completed: [] };
        let html = '';
        for (let i = 1; i <= total; i++) {
            const done = prog.completed.includes(i);
            html += `
                <div class="lesson-row ${done ? 'done' : ''}">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="lesson-num">${done ? '<i class="fas fa-check" style="font-size:10px;"></i>' : i}</div>
                        <span class="lesson-label">الدرس ${i}</span>
                    </div>
                    <button class="lesson-check" onclick="toggleLesson(${i})">
                        <i class="fas ${done ? 'fa-check-circle' : 'fa-circle'}"></i>
                    </button>
                </div>
            `;
        }
        container.innerHTML = html;
        updateProgressUI(courseId, total);
    }

    function toggleLesson(idx) {
        const id = appState.currentCourseId;
        if (!id) return;
        if (!appState.progress[id]) appState.progress[id] = { completed: [] };
        const list = appState.progress[id].completed;
        if (list.includes(idx)) {
            appState.progress[id].completed = list.filter(i => i !== idx);
        } else {
            appState.progress[id].completed.push(idx);
        }
        localStorage.setItem("courseProgress", JSON.stringify(appState.progress));
        if (!appState.pendingProgressUpdates[id]) appState.pendingProgressUpdates[id] = { completed: [] };
        appState.pendingProgressUpdates[id].completed = [...appState.progress[id].completed];

        const course = allCourses.find(c => c.id === id);
        renderPlaylist(id, course?.num || 10);
    }

    async function flushProgress() {
        if (!Object.keys(appState.pendingProgressUpdates).length || !auth.currentUser) return;
        const batch = db.batch();
        const userId = auth.currentUser.uid;
        for (const [courseId, p] of Object.entries(appState.pendingProgressUpdates)) {
            batch.set(
                db.collection('users').doc(userId).collection('progress').doc(courseId),
                { completed: p.completed, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
                { merge: true }
            );
        }
        try {
            await batch.commit();
            appState.pendingProgressUpdates = {};
        } catch (e) { console.warn("Progress flush error:", e); }
    }

    function toggleCompleteVideo() {
        const id = appState.currentCourseId;
        if (!id) return;
        const course = allCourses.find(c => c.id === id);
        const total = course?.num || 10;
        if (!appState.progress[id]) appState.progress[id] = { completed: [] };
        const list = appState.progress[id].completed;
        let next = 1;
        while (list.includes(next) && next <= total) next++;
        if (next <= total) {
            toggleLesson(next);
            showToast(`✅ تم إكمال الدرس ${next}`, 'success');
        } else {
            showToast('🎉 لقد أتممت جميع الدروس!', 'info');
        }
    }

    function updateProgressUI(id, total) {
        const done = appState.progress[id]?.completed.length || 0;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        document.getElementById('progressBarFill').style.width = pct + '%';
        document.getElementById('progressPercentage').innerText = pct + '% مكتمل';
    }

    // ==========================================
    // MY COURSES
    // ==========================================
    function renderMyCourses() {
        const grid = document.getElementById('myCoursesGrid');
        const last = JSON.parse(localStorage.getItem("lastViewedCourse") || 'null');
        const banner = document.getElementById('resumeLearningBanner');

        if (last && appState.myCourses.includes(last.id)) {
            banner.style.display = 'block';
            document.getElementById('resumeTitle').innerText = last.title;
            document.getElementById('resumeBtn').onclick = () => openPlayer(last.id);
        } else {
            banner.style.display = 'none';
        }

        if (!appState.myCourses.length) {
            grid.innerHTML = `
                <div class="empty-state show" style="grid-column:1/-1;">
                    <div class="empty-icon"><i class="fas fa-book-open"></i></div>
                    <h3 class="empty-title">لا توجد دورات بعد</h3>
                    <p class="empty-desc">سجّل في دورتك الأولى وابدأ رحلة التعلم</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = appState.myCourses.map(id => {
            const c = allCourses.find(x => x.id === id);
            if (!c) return '';
            const total = c.num || 10;
            const done = appState.progress[id]?.completed.length || 0;
            const pct = Math.round((done / total) * 100);
            return `
                <div class="my-course-card" onclick="openPlayer('${id}')">
                    <div class="my-course-thumb"><i class="fas fa-play"></i></div>
                    <div class="my-course-body">
                        <h4 class="my-course-title">${c.title}</h4>
                        <div class="my-course-meta">
                            <span>${done}/${total} درس</span>
                            <span>${pct}%</span>
                        </div>
                        <div class="my-progress-track">
                            <div class="my-progress-fill" style="width:${pct}%"></div>
                        </div>
                    </div>
                    <button class="my-course-remove" onclick="removeCourse('${id}', event)">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `;
        }).join('');
    }

    function removeCourse(id, e) {
        e.stopPropagation();
        if (!confirm("هل تريد حذف الدورة؟")) return;
        appState.myCourses = appState.myCourses.filter(x => x !== id);
        localStorage.setItem("myCourses", JSON.stringify(appState.myCourses));
        renderMyCourses();
        renderCourses();
        updateNavState();
    }

    // ==========================================
    // NAVIGATION
    // ==========================================
    function showHome() {
        document.getElementById('coursesSection').style.display = '';
        document.getElementById('myCoursesView').style.display = 'none';
        document.getElementById('navHome').classList.add('active');
        document.getElementById('navMy').classList.remove('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showMyCourses() {
        document.getElementById('coursesSection').style.display = 'none';
        document.getElementById('myCoursesView').style.display = '';
        document.getElementById('navHome').classList.remove('active');
        document.getElementById('navMy').classList.add('active');
        renderMyCourses();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openWhatsApp() {
        window.open("https://wa.me/249924299798", "_blank");
    }

    function updateNavState() {
        const dot = document.getElementById('myCoursesDot');
        if (appState.myCourses.length > 0) dot.style.display = 'block';
        else dot.style.display = 'none';
    }

    // ==========================================
    // FILTER
    // ==========================================
    function filterByCategory(cat) {
        currentFilter = cat === 'all' ? null : cat;
        renderCourses(currentFilter);
        const sec = document.getElementById('coursesSection');
        const y = sec.getBoundingClientRect().top + window.pageYOffset - 100;
        window.scrollTo({ top: y, behavior: 'smooth' });
    }

    // ==========================================
    // SEARCH
    // ==========================================
    function debounce(fn, delay) {
        let t;
        return function (...args) {
            clearTimeout(t);
            t = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function setupEvents() {
        const search = document.getElementById('searchInput');
        search.addEventListener('input', debounce(e => {
            currentFilter = e.target.value || null;
            renderCourses(currentFilter);
        }, 250));

        document.getElementById('categoryFilter').addEventListener('change', e => {
            currentFilter = e.target.value || null;
            renderCourses(currentFilter);
        });
    }

    // ==========================================
    // BOOT
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        setupTheme();
        renderSkeletons();
        initCategoriesMarquee();
        setupEvents();
        updateNavState();
        initializeApp();

        window.addEventListener('beforeunload', () => {
            flushProgress();
            flushEnrollments();
        });
    });

    // ==========================================
    // ANTIDEBUG
    // ==========================================
    (() => {
        document.addEventListener("keydown", e => {
            if ((e.ctrlKey && e.shiftKey && ["I","C","J","L"].includes(e.key.toUpperCase())) || e.key === "F12" || (e.ctrlKey && e.key.toUpperCase() === "U")) e.preventDefault();
        });
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("cut", e => e.preventDefault());
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("selectstart", e => e.preventDefault());
    })();
</script>
</body>
</html>
