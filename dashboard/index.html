<style>
    /* ============================================
       DESIGN TOKENS — Premium Blue & White
    ============================================ */
    :root {
        --blue-50:  #EFF6FF;
        --blue-100: #DBEAFE;
        --blue-200: #BFDBFE;
        --blue-300: #93C5FD;
        --blue-400: #60A5FA;
        --blue-500: #3B82F6;
        --blue-600: #2563EB;
        --blue-700: #1D4ED8;
        --blue-800: #1E40AF;
        --blue-900: #1E3A8A;
        --blue-950: #172554;

        --ink-900: #0F172A;
        --ink-700: #334155;
        --ink-500: #64748B;
        --ink-300: #CBD5E1;

        --surface: #FFFFFF;
        --surface-soft: #F8FAFC;
        --surface-mute: #F1F5F9;

        --ring-blue: 0 0 0 4px rgba(59, 130, 246, 0.14);
        --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
        --shadow-lg: 0 12px 28px -6px rgba(30, 64, 175, 0.16), 0 4px 10px -4px rgba(15, 23, 42, 0.06);
        --shadow-xl: 0 24px 48px -12px rgba(30, 64, 175, 0.20), 0 8px 16px -8px rgba(15, 23, 42, 0.08);
        --shadow-glow: 0 8px 32px -4px rgba(59, 130, 246, 0.35);

        --border-soft: 1px solid rgba(148, 163, 184, 0.16);
        --border-blue: 1px solid rgba(59, 130, 246, 0.18);
    }

    .dark {
        --surface: #0B1220;
        --surface-soft: #0F172A;
        --surface-mute: #1E293B;

        --ink-900: #F1F5F9;
        --ink-700: #CBD5E1;
        --ink-500: #94A3B8;
        --ink-300: #475569;

        --border-soft: 1px solid rgba(148, 163, 184, 0.10);
        --border-blue: 1px solid rgba(59, 130, 246, 0.22);

        --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.5), 0 4px 10px -4px rgba(0, 0, 0, 0.3);
        --shadow-xl: 0 24px 48px -12px rgba(0, 0, 0, 0.6), 0 8px 16px -8px rgba(0, 0, 0, 0.4);
    }

    * { -webkit-tap-highlight-color: transparent; }

    html, body {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    body {
        background:
            radial-gradient(1200px 600px at 100% -10%, rgba(59, 130, 246, 0.08), transparent 60%),
            radial-gradient(900px 500px at -10% 10%, rgba(37, 99, 235, 0.06), transparent 55%),
            linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
        color: var(--ink-900);
        min-height: 100vh;
    }

    .dark body {
        background:
            radial-gradient(1200px 600px at 100% -10%, rgba(59, 130, 246, 0.10), transparent 60%),
            radial-gradient(900px 500px at -10% 10%, rgba(37, 99, 235, 0.08), transparent 55%),
            linear-gradient(180deg, #0B1220 0%, #0F172A 100%);
        color: var(--ink-900);
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* ============================================
       SURFACES
    ============================================ */
    .glass {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }
    .dark .glass {
        background: rgba(11, 18, 32, 0.75);
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .glass-card {
        background: var(--surface);
        border: var(--border-soft);
        box-shadow: var(--shadow-sm);
        transition: box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                    border-color 0.35s ease;
    }
    .dark .glass-card {
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.85));
        border: 1px solid rgba(148, 163, 184, 0.08);
    }

    /* ============================================
       HEADER
    ============================================ */
    .brand-badge {
        width: 40px; height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue-700) 0%, var(--blue-500) 60%, #38BDF8 130%);
        box-shadow:
            0 1px 0 rgba(255,255,255,0.3) inset,
            0 8px 20px -6px rgba(29, 78, 216, 0.55);
        position: relative;
        overflow: hidden;
    }
    .brand-badge::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.4), transparent 55%);
        pointer-events: none;
    }
    .brand-title {
        background: linear-gradient(135deg, var(--blue-800) 0%, var(--blue-500) 70%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
    }
    .dark .brand-title {
        background: linear-gradient(135deg, #93C5FD 0%, #60A5FA 70%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .icon-btn {
        width: 40px; height: 40px;
        border-radius: 12px;
        background: var(--surface-soft);
        border: var(--border-soft);
        color: var(--ink-700);
        display: flex; align-items: center; justify-content: center;
        transition: all 0.25s ease;
        position: relative;
    }
    .icon-btn:hover {
        background: var(--blue-50);
        color: var(--blue-700);
        border-color: rgba(59, 130, 246, 0.28);
        transform: translateY(-1px);
    }
    .dark .icon-btn {
        background: rgba(30, 41, 59, 0.6);
        color: #CBD5E1;
    }
    .dark .icon-btn:hover {
        background: rgba(37, 99, 235, 0.15);
        color: #93C5FD;
        border-color: rgba(59, 130, 246, 0.35);
    }

    /* ============================================
       SEARCH BAR
    ============================================ */
    .search-shell {
        background: var(--surface);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        box-shadow: var(--shadow-md);
        transition: box-shadow 0.3s ease, border-color 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .search-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 18px;
        padding: 1px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(56, 189, 248, 0.05));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }
    .dark .search-shell {
        background: rgba(15, 23, 42, 0.7);
        border-color: rgba(148, 163, 184, 0.10);
    }
    .search-shell:focus-within {
        box-shadow: var(--shadow-lg), var(--ring-blue);
        border-color: rgba(59, 130, 246, 0.4);
    }

    .search-input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--ink-900);
        font-weight: 500;
        font-size: 15px;
    }
    .search-input::placeholder { color: var(--ink-500); opacity: 0.85; }
    .dark .search-input { color: #F1F5F9; }
    .dark .search-input::placeholder { color: #64748B; }

    .search-icon-badge {
        width: 34px; height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--blue-50), var(--blue-100));
        color: var(--blue-700);
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
    }
    .dark .search-icon-badge {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(59, 130, 246, 0.10));
        color: #93C5FD;
    }

    .select-wrap {
        position: relative;
        border-radius: 12px;
        background: var(--surface-soft);
        border: 1px solid rgba(148, 163, 184, 0.16);
        transition: all 0.25s ease;
    }
    .dark .select-wrap {
        background: rgba(30, 41, 59, 0.5);
        border-color: rgba(148, 163, 184, 0.10);
    }
    .select-wrap:hover { border-color: rgba(59, 130, 246, 0.3); }
    .select-wrap select {
        background: transparent;
        border: none;
        outline: none;
        appearance: none;
        padding: 10px 36px 10px 14px;
        font-weight: 600;
        font-size: 13px;
        color: var(--ink-700);
        cursor: pointer;
        width: 100%;
        font-family: inherit;
    }
    .dark .select-wrap select { color: #CBD5E1; }
    .select-wrap::after {
        content: '\f107';
        font-family: 'Font Awesome 6 Free';
        font-weight: 900;
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-500);
        font-size: 11px;
        pointer-events: none;
    }

    /* ============================================
       SECTION HEADERS
    ============================================ */
    .section-title {
        font-weight: 800;
        color: var(--ink-900);
        letter-spacing: -0.02em;
        display: flex; align-items: center; gap: 10px;
        font-size: 20px;
    }
    .section-title-badge {
        width: 32px; height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--blue-50), var(--blue-100));
        color: var(--blue-700);
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
        box-shadow: 0 2px 6px -1px rgba(37, 99, 235, 0.15);
        flex-shrink: 0;
    }
    .dark .section-title-badge {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(59, 130, 246, 0.12));
        color: #93C5FD;
    }

    /* ============================================
       CATEGORIES MARQUEE
    ============================================ */
    .categories-marquee {
        position: relative;
        overflow: hidden;
        padding: 6px 0 18px;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
        cursor: grab;
    }
    .categories-marquee:active { cursor: grabbing; }

    .categories-track {
        display: flex;
        gap: 14px;
        width: max-content;
        will-change: transform;
        transform: translateZ(0);
        backface-visibility: hidden;
    }
    .categories-track.anim-2 { animation: categoriesScrollRight2 42s linear infinite; }
    .categories-track.anim-4 { animation: categoriesScrollRight4 58s linear infinite; }

    @keyframes categoriesScrollRight2 {
        0%   { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
    }
    @keyframes categoriesScrollRight4 {
        0%   { transform: translateX(-75%); }
        100% { transform: translateX(0%); }
    }

    .categories-marquee:hover .categories-track,
    .categories-marquee.paused .categories-track {
        animation-play-state: paused;
    }

    /* Category Chip */
    .category-chip {
        min-width: 112px;
        height: 108px;
        padding: 14px 18px;
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #FFFFFF;
        border: 1px solid rgba(148, 163, 184, 0.14);
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.35s ease,
                    border-color 0.35s ease,
                    background 0.35s ease;
        flex-shrink: 0;
        user-select: none;
        box-shadow: var(--shadow-xs);
        position: relative;
        overflow: hidden;
    }
    .category-chip::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(59, 130, 246, 0.04), transparent 40%);
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
    }
    .category-chip:hover::after { opacity: 1; }

    .dark .category-chip {
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
        border-color: rgba(148, 163, 184, 0.08);
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .category-chip:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 32px -12px rgba(30, 64, 175, 0.28), 0 4px 8px -2px rgba(15, 23, 42, 0.06);
        border-color: rgba(59, 130, 246, 0.4);
    }
    .category-icon-wrap {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: linear-gradient(135deg, var(--blue-50), var(--blue-100));
        color: var(--blue-700);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 4px rgba(37, 99, 235, 0.08);
        position: relative;
        z-index: 1;
    }
    .dark .category-icon-wrap {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(59, 130, 246, 0.12));
        color: #93C5FD;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .category-chip:hover .category-icon-wrap {
        transform: scale(1.12) rotate(-6deg);
    }
    .category-chip span {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-700);
        letter-spacing: -0.01em;
        white-space: nowrap;
        position: relative;
        z-index: 1;
    }
    .dark .category-chip span { color: #CBD5E1; }

    .category-chip-all {
        background: linear-gradient(135deg, var(--blue-700) 0%, var(--blue-500) 100%);
        border-color: transparent;
        box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.5);
    }
    .category-chip-all::after {
        background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.22), transparent 60%);
        opacity: 1;
    }
    .category-chip-all .category-icon-wrap {
        background: rgba(255, 255, 255, 0.18);
        color: #FFFFFF;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .category-chip-all span { color: #FFFFFF; }
    .category-chip-all:hover {
        box-shadow: 0 22px 36px -10px rgba(37, 99, 235, 0.55);
    }

    @media (max-width: 640px) {
        .categories-track { gap: 12px; }
        .category-chip {
            min-width: 96px;
            height: 96px;
            border-radius: 16px;
            padding: 12px 14px;
        }
        .category-icon-wrap { width: 38px; height: 38px; font-size: 16px; border-radius: 11px; }
        .category-chip span { font-size: 12px; }
    }

    /* ============================================
       COURSE CARDS
    ============================================ */
    .course-card {
        content-visibility: auto;
        contain-intrinsic-size: 400px;
        will-change: transform;
        border-radius: 20px;
        background: #FFFFFF;
        border: 1px solid rgba(148, 163, 184, 0.14);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.4s ease,
                    border-color 0.4s ease;
        position: relative;
    }
    .dark .course-card {
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
        border-color: rgba(148, 163, 184, 0.08);
    }
    .course-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 24px 44px -16px rgba(30, 64, 175, 0.28), 0 8px 16px -8px rgba(15, 23, 42, 0.06);
        border-color: rgba(59, 130, 246, 0.28);
    }
    .course-card .video-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
    }
    .course-card .video-wrap iframe {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        border: 0;
    }
    .course-card .cat-pill {
        position: absolute;
        top: 12px; left: 12px;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        color: var(--blue-800);
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
        border: 1px solid rgba(255,255,255,0.5);
    }
    .dark .course-card .cat-pill {
        background: rgba(15, 23, 42, 0.85);
        color: #93C5FD;
        border-color: rgba(255,255,255,0.08);
    }
    .course-card .cat-pill i {
        color: var(--blue-600);
        font-size: 9px;
    }

    .course-price-free {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
        color: #047857;
        font-size: 12px;
        font-weight: 800;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .dark .course-price-free {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.10));
        color: #6EE7B7;
        border-color: rgba(16, 185, 129, 0.25);
    }
    .course-price-paid {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--blue-50), var(--blue-100));
        color: var(--blue-800);
        font-size: 12px;
        font-weight: 800;
        border: 1px solid rgba(59, 130, 246, 0.22);
    }
    .dark .course-price-paid {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(59, 130, 246, 0.10));
        color: #93C5FD;
        border-color: rgba(59, 130, 246, 0.3);
    }

    .btn-primary {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 9px 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue-700) 0%, var(--blue-500) 100%);
        color: #FFFFFF;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: -0.01em;
        border: none;
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        box-shadow: 0 6px 14px -4px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        position: relative;
        overflow: hidden;
    }
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px -6px rgba(37, 99, 235, 0.55), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-enrolled {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 9px 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
        color: #047857;
        font-weight: 700;
        font-size: 13px;
        border: 1px solid rgba(16, 185, 129, 0.25);
        cursor: pointer;
        transition: all 0.25s ease;
    }
    .btn-enrolled:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px -6px rgba(16, 185, 129, 0.35);
    }
    .dark .btn-enrolled {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.10));
        color: #6EE7B7;
        border-color: rgba(16, 185, 129, 0.28);
    }

    /* ============================================
       SKELETON
    ============================================ */
    .skeleton {
        background: linear-gradient(90deg, #EFF3F8 25%, #F8FAFC 50%, #EFF3F8 75%);
        background-size: 200% 100%;
        animation: loading 1.6s ease-in-out infinite;
        border-radius: 12px;
    }
    .dark .skeleton {
        background: linear-gradient(90deg, #1E293B 25%, #273449 50%, #1E293B 75%);
        background-size: 200% 100%;
    }
    @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* ============================================
       BOTTOM NAV
    ============================================ */
    .bottom-nav {
        background: rgba(255, 255, 255, 0.92);

                    <div class="skeleton w-20 h-8 rounded-lg"></div>
                    <div class="skeleton w-24 h-8 rounded-lg"></div>
                </div>
            </div>
        `).join('');
    }

    // --- ✅ CHANGE DETECTION ---
    function coursesChanged(oldCourses, newCourses) {
        if (!oldCourses || !newCourses) return true;
        if (oldCourses.length !== newCourses.length) return true;
        const sig = c => `${c.id}|${c.title||''}|${c.category||''}|${c.description||''}|${c.price||''}|${c.playlist_id||''}|${c.num||''}`;
        const oldSig = oldCourses.map(sig).sort().join('###');
        const newSig = newCourses.map(sig).sort().join('###');
        return oldSig !== newSig;
    }

    // --- ✅ INIT ---
    async function initializeApp() {
        try {
            if (!auth.currentUser) {
                await auth.signInAnonymously();
                console.log("✅ Anonymous login successful");
            }

            const cachedCourses = loadCoursesFromCache();
            if (cachedCourses && cachedCourses.length > 0) {
                allCourses = cachedCourses;
                console.log(`📦 Loaded ${allCourses.length} courses from cache (100h TTL)`);
                renderCategories();
                renderCourses();
            }

            setupRealtimeListener();

            if (!cachedCourses || cachedCourses.length === 0) {
                await fetchCoursesFromServerAndCache();
            }
        } catch (error) {
            console.error("❌ Initialization error:", error);
            showToast("⚠️ حدث خطأ في الاتصال", "error");
            document.getElementById('coursesGrid').innerHTML = `
                <div class="col-span-3 text-center py-16">
                    <div class="w-20 h-20 bg-red-50 dark:bg-red-950/30 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
                    </div>
                    <h3 class="text-lg font-extrabold text-gray-800 dark:text-white mb-1">تعذر تحميل الدورات</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400">يرجى التحقق من اتصالك بالإنترنت</p>
                </div>
            `;
        }

        setInterval(() => {
            flushProgressUpdates();
            flushEnrollments();
        }, 60000);
    }

    // --- ✅ REAL-TIME ---
    function setupRealtimeListener() {
        if (unsubscribeRealtime) {
            unsubscribeRealtime();
            unsubscribeRealtime = null;
        }

        unsubscribeRealtime = db.collection('courses').onSnapshot((snapshot) => {
            const serverCourses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            serverCourses.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            const hasChanged = coursesChanged(allCourses, serverCourses);

            if (hasChanged) {
                allCourses = serverCourses;
                saveCoursesToCache(allCourses);
                renderCategories();
                renderCourses();
                if (realtimeInitialized) console.log(`🔄 Real-time: ${allCourses.length} courses`);
            }
            realtimeInitialized = true;
        }, (error) => { console.warn("Realtime listener error:", error); });
    }

    async function fetchCoursesFromServerAndCache() {
        try {
            const snapshot = await db.collection('courses').get({ source: 'server' });
            const serverCourses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            serverCourses.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            allCourses = serverCourses;
            saveCoursesToCache(allCourses);
            console.log(`📡 Fetched ${allCourses.length} courses and cached (100h)`);
            renderCategories();
            renderCourses();
        } catch (error) {
            console.error("❌ Error fetching from server:", error);
            const cached = loadCoursesFromCache();
            if (cached && cached.length) {
                allCourses = cached;
                renderCategories();
                renderCourses();
            } else {
                allCourses = [];
                renderCategories();
                renderCourses();
            }
        }
    }

    // --- ✅ MARQUEE ---
    function initCategoriesMarquee() {
        const marquee = document.getElementById('categoriesMarquee');
        if (!marquee) return;
        let resumeTimeout = null;

        const pause = () => {
            if (resumeTimeout) { clearTimeout(resumeTimeout); resumeTimeout = null; }
            marquee.classList.add('paused');
        };
        const resume = (delay = 1500) => {
            if (resumeTimeout) clearTimeout(resumeTimeout);
            resumeTimeout = setTimeout(() => marquee.classList.remove('paused'), delay);
        };

        marquee.addEventListener('touchstart', pause, { passive: true });
        marquee.addEventListener('touchend', () => resume(1800), { passive: true });
        marquee.addEventListener('touchcancel', () => resume(1800), { passive: true });
        marquee.addEventListener('mouseenter', pause);
        marquee.addEventListener('mouseleave', () => resume(0));
        marquee.addEventListener('mousedown', pause);
        marquee.addEventListener('mouseup', () => resume(1800));

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pause();
            else marquee.classList.remove('paused');
        });
    }

    // --- ✅ BUILD COURSE CARD ---
    function buildCourseCardHTML(course, isEnrolled) {
        const isFree = (course.price === 'free' || course.price === 'مجانية' || !course.price);
        const priceDisplay = isFree
            ? '<span class="course-price-free"><i class="fas fa-bolt"></i> مجانية</span>'
            : `<span class="course-price-paid"><i class="fas fa-tag"></i> ${course.price}</span>`;

        let videoEmbed;
        if (course.playlist_id) {
            videoEmbed = `<iframe
                              src="https://www.youtube.com/embed/videoseries?list=${course.playlist_id}"
                              frameborder="0"
                              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                              allowfullscreen
                              loading="lazy">
                          </iframe>`;
        } else {
            videoEmbed = `<div class="absolute inset-0 w-full h-full bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-900 flex items-center justify-center text-gray-400"><i class="fas fa-video-slash text-2xl"></i></div>`;
        }

        return `
            <div class="course-card">
                <div class="video-wrap">
                    ${videoEmbed}
                    <div class="cat-pill">
                        <i class="fas fa-circle"></i>
                        ${course.category || 'عام'}
                    </div>
                </div>
                <div class="p-5 flex flex-col flex-1">
                    <h3 class="text-[15px] font-extrabold text-gray-800 dark:text-white mb-2 line-clamp-2 leading-snug tracking-tight">${course.title || 'بدون عنوان'}</h3>
                    <p class="text-[13px] text-gray-500 dark:text-gray-400 mb-4 line-clamp-2 flex-1 leading-relaxed">${course.description || 'لا يوجد وصف'}</p>
                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100 dark:border-gray-800">
                        ${priceDisplay}
                        <button onclick="${isEnrolled ? `openPlayer('${course.id}')` : `enrollCourse('${course.id}')`}"
                            class="${isEnrolled ? 'btn-enrolled' : 'btn-primary'}">
                            ${isEnrolled ? 'استكمال <i class="fas fa-play text-[9px]"></i>' : 'سجّل الآن <i class="fas fa-arrow-left text-[10px]"></i>'}
                        </button>
                    </div>
                </div>
            </div>

    // --- ✅ RENDER COURSES ---
    function renderCourses(filter = null) {
        if (filter !== null) currentFilter = filter;
        const grid = document.getElementById('coursesGrid');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const noResults = document.getElementById('noResults');
        const coursesCount = document.getElementById('coursesCount');

        let filtered = allCourses;

        if (!filtered || filtered.length === 0) {
            grid.innerHTML = '';
            noResults.classList.remove('hidden');
            noResults.classList.add('flex');
            loadMoreBtn.style.display = 'none';
            if (coursesCount) coursesCount.textContent = '';
            return;
        }

        const f = currentFilter;
        if (f && f !== 'all' && f !== '') {
            filtered = filtered.filter(c =>
                (c.category || 'عام') === f ||
                (c.title && c.title.includes(f)) ||
                (c.description && c.description.includes(f))
            );
        }

        if (filtered.length === 0) {
            grid.innerHTML = '';
            noResults.classList.remove('hidden');
            noResults.classList.add('flex');
            loadMoreBtn.style.display = 'none';
            if (coursesCount) coursesCount.textContent = '';
            return;
        }

        noResults.classList.add('hidden');
        noResults.classList.remove('flex');

        const pageCourses = filtered.slice(0, pageSize);
        displayedCourses = filtered;

        grid.innerHTML = pageCourses.map(course => {
            const isEnrolled = appState.myCourses.includes(course.id);
            return buildCourseCardHTML(course, isEnrolled);
        }).join('');

        if (coursesCount) coursesCount.textContent = `${filtered.length} دورة`;

        if (filtered.length > pageSize) {
            loadMoreBtn.style.display = 'inline-flex';
            loadMoreBtn.onclick = () => loadMoreFilteredCourses();
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    function loadMoreFilteredCourses() {
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const grid = document.getElementById('coursesGrid');
        const currentDisplayCount = grid.children.length;
        const totalFiltered = displayedCourses.length;
        if (currentDisplayCount >= totalFiltered) {
            loadMoreBtn.style.display = 'none';
            return;
        }
        const nextCount = Math.min(currentDisplayCount + pageSize, totalFiltered);
        const nextCourses = displayedCourses.slice(currentDisplayCount, nextCount);
        const fragment = document.createDocumentFragment();
        nextCourses.forEach(course => {
            const isEnrolled = appState.myCourses.includes(course.id);
            const wrapper = document.createElement('div');
            wrapper.innerHTML = buildCourseCardHTML(course, isEnrolled).trim();
            fragment.appendChild(wrapper.firstChild);
        });
        grid.appendChild(fragment);
        if (currentDisplayCount + nextCourses.length >= totalFiltered) {
            loadMoreBtn.style.display = 'none';
        }
    }

    // --- ✅ ENROLLMENT ---
    function enrollCourse(id) {
        if (!appState.myCourses.includes(id)) {
            appState.myCourses.push(id);
            localStorage.setItem("myCourses", JSON.stringify(appState.myCourses));
            if (!appState.progress[id]) {
                appState.progress[id] = { completed: [], total: 10 };
                localStorage.setItem("courseProgress", JSON.stringify(appState.progress));
            }
            showToast("تم التسجيل بنجاح 🎉", "success");
            renderCourses();
            renderMyCourses();
            updateNavState();
            queueEnrollmentWrite(id);
        }
    }

    function queueEnrollmentWrite(courseId) {
        if (!auth.currentUser) return;
        appState.pendingEnrollments.push({
            userId: auth.currentUser.uid,
            courseId,
            enrolledAt: new Date().toISOString()
        });
    }

    async function flushEnrollments() {
        if (appState.pendingEnrollments.length === 0 || !auth.currentUser) return;
        const batch = db.batch();
        const userRef = db.collection('users').doc(auth.currentUser.uid);
        appState.pendingEnrollments.forEach(enrollment => {
            const enrollmentRef = userRef.collection('enrollments').doc(enrollment.courseId);
            batch.set(enrollmentRef, {
                enrolledAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        });
        try {
            await batch.commit();
            console.log(`✅ Flushed ${appState.pendingEnrollments.length} enrollments`);
            appState.pendingEnrollments = [];
        } catch (error) { console.error("Error flushing enrollments:", error); }
    }

    // --- ✅ PLAYER ---
    function openPlayer(id) {
        const course = allCourses.find(c => c.id === id);
        if (!course) return;
        appState.currentCourseId = id;
        document.getElementById('playerCourseTitle').innerText = course.title;
        document.getElementById('playerCourseLabel').innerText = course.title;
        document.getElementById('playerCourseDesc').innerText = course.description || '';

        const frame = document.getElementById('playerFrame');
        if (course.playlist_id) {
            frame.src = `https://www.youtube.com/embed/videoseries?list=${course.playlist_id}`;
        } else {
            frame.src = "";
        }
        const totalVideos = course.num || 10;
        renderPlaylistItems(id, totalVideos);
        document.getElementById('playerOverlay').classList.remove('translate-y-full');
        localStorage.setItem("lastViewedCourse", JSON.stringify({ id: course.id, title: course.title }));
    }

    function closePlayer() {
        document.getElementById('playerOverlay').classList.add('translate-y-full');
        document.getElementById('playerFrame').src = "";
        renderMyCourses();
        flushProgressUpdates();
    }

    function renderPlaylistItems(courseId, totalVideos) {
        const container = document.getElementById('playlistContainer');
        const progressData = appState.progress[courseId] || { completed: [] };
        let html = '';
        for (let i = 1; i <= totalVideos; i++) {
            const isCompleted = progressData.completed.includes(i);
            html += `
                <div class="lesson-row ${isCompleted ? 'done' : ''}">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-[12px] font-extrabold ${isCompleted ? 'bg-gradient-to-br from-emerald-500 to-green-600 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300'}">
                            ${isCompleted ? '<i class="fas fa-check text-[11px]"></i>' : i}
                        </div>
                        <span class="text-[13px] font-bold text-gray-700 dark:text-gray-200">الدرس ${i}</span>
                    </div>
                    <button onclick="toggleLessonComplete(${i})" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all ${isCompleted ? 'text-emerald-500' : 'text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-950/30'}">
                        <i class="fas ${isCompleted ? 'fa-check-circle' : 'fa-circle'} text-[13px]"></i>
                    </button>
                </div>
            `;
        }
        container.innerHTML = html;
        updateProgressUI(courseId, totalVideos);
    }

    function toggleLessonComplete(lessonIndex) {
        const id = appState.currentCourseId;
        if (!id) return;
        if (!appState.progress[id]) appState.progress[id] = { completed: [] };
        const list = appState.progress[id].completed;
        if (list.includes(lessonIndex)) {
            appState.progress[id].completed = list.filter(i => i !== lessonIndex);
        } else {
            appState.progress[id].completed.push(lessonIndex);
        }
        localStorage.setItem("courseProgress", JSON.stringify(appState.progress));
        if (!appState.pendingProgressUpdates[id]) {
            appState.pendingProgressUpdates[id] = { completed: [...appState.progress[id].completed] };
        } else {
            appState.pendingProgressUpdates[id].completed = [...appState.progress[id].completed];
        }
        const course = allCourses.find(c => c.id === id);
        const total = course?.num || 10;
        renderPlaylistItems(id, total);
        updateProgressUI(id, total);
    }

    async function flushProgressUpdates() {
        if (Object.keys(appState.pendingProgressUpdates).length === 0 || !auth.currentUser) return;
        const batch = db.batch();
        const userId = auth.currentUser.uid;
        for (const [courseId, progress] of Object.entries(appState.pendingProgressUpdates)) {
            const docRef = db.collection('users').doc(userId).collection('progress').doc(courseId);
            batch.set(docRef, {
                completed: progress.completed,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        }
        try {
            await batch.commit();
            console.log(`✅ Progress batch (${Object.keys(appState.pendingProgressUpdates).length})`);
            appState.pendingProgressUpdates = {};
        } catch (error) { console.error("Error writing progress batch:", error); }
    }

    function toggleCompleteVideo() {
        const id = appState.currentCourseId;
        if (!id) return;
        const course = allCourses.find(c => c.id === id);
        const total = course?.num || 10;
        if (!appState.progress[id]) appState.progress[id] = { completed: [] };
        const completedList = appState.progress[id].completed;
        let targetLesson = 1;
        while (completedList.includes(targetLesson) && targetLesson <= total) targetLesson++;
        if (targetLesson <= total) {
            toggleLessonComplete(targetLesson);
            showToast(`✅ تم إكمال الدرس ${targetLesson}`, 'success');
        } else {
            showToast('🎉 لقد أتممت جميع الدروس!', 'info');
        }
    }

    function updateProgressUI(id, total) {
        const completed = appState.progress[id]?.completed.length || 0;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById('progressBarFill').style.width = `${percent}%`;
        document.getElementById('progressPercentage').innerText = `${percent}% مكتمل`;
    }

    function removeCourse(id, event) {
        event.stopPropagation();
        if (confirm("هل أنت متأكد من حذف الدورة؟")) {
            appState.myCourses = appState.myCourses.filter(cid => cid !== id);
            localStorage.setItem("myCourses", JSON.stringify(appState.myCourses));
            renderMyCourses();
            renderCourses();
            updateNavState();
        }
    }

    function updateNavState() {
        if (appState.myCourses.length > 0) {
            document.getElementById('myCoursesDot').classList.remove('hidden');
        } else {
            document.getElementById('myCoursesDot').classList.add('hidden');
        }
    }

    // --- ✅ FILTERS ---
    function filterByCategory(cat) {
        currentFilter = (cat === 'all') ? null : cat;
        renderCourses(currentFilter);
        const target = document.getElementById('coursesSection');
        window.scrollTo({ top: target.offsetTop - 100, behavior: 'smooth' });
    }

    function debounce(fn, delay) {
        let t;
        return function(...args) {
            clearTimeout(t);
            t = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function setupEventListeners() {
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', debounce((e) => {
            currentFilter = e.target.value;
            renderCourses(currentFilter);
        }, 250));

        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderCourses(currentFilter);
        });
    }

    // --- ✅ DOMContentLoaded ---
    document.addEventListener('DOMContentLoaded', () => {
        setupTheme();
        renderSkeletons();
        initCategoriesMarquee();
        initializeApp();
        setupEventListeners();
        updateNavState();

        window.addEventListener('beforeunload', () => {
            flushProgressUpdates();
            flushEnrollments();
        });
    });

    // ===== antidebug =====
    (() => {
        document.addEventListener("keydown", (e) => {
            if (
                (e.ctrlKey && e.shiftKey && ["I", "C", "J", "L"].includes(e.key.toUpperCase())) ||
                (e.key === "F12") ||
                (e.ctrlKey && e.key.toUpperCase() === "U")
            ) e.preventDefault();
        });
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("cut", e => e.preventDefault());
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("selectstart", e => e.preventDefault());
        let detectSize = () => {
            if (window.outerWidth - window.innerWidth > 200 || window.outerHeight - window.innerHeight > 200) console.clear();
        };
        window.addEventListener("resize", detectSize);
        let start = performance.now();
        console.log("%c ", "font-size:200px;");
        let end = performance.now();
        if (end - start > 50) console.clear();
        const observer = new MutationObserver(() => { console.clear(); });
        observer.observe(document.documentElement, { attributes: true, childList: false, subtree: false });
        setInterval(() => {
            const t = Date.now();
            debugger;
            if (Date.now() - t > 100) console.clear();
        }, 500);
    })();
</script>
</body>
</html>
